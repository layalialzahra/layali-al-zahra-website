name: Build verification

permissions:
  contents: write

on:
  push:
    branches: [main, feat/layali-managed-content-cms]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Sync package lock on implementation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/layali-managed-content-cms'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lock for test tooling"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
