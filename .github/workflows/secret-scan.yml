name: Historical secret scan

on:
  push:
    branches: [feat/layali-managed-content-cms]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan reachable Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all history and refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan all reachable history with redacted output
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="--all" .
